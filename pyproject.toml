[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saira"
version = "1.0.0"
description = "Self-consistent Algorithm for spectral Indices measuRements and Analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Joao P. V. Benedetti"},
    {name = "Rogerio Riffel"},
]

dependencies = [
    "astropy",
    "pandas",
    "scipy",
    "matplotlib",
    "PyQt5",
]

[project.scripts]
saira-gui = "saira.gui.main_gui:main"

[project.urls]
Homepage = "https://github.com/rriffel/saira"
Repository = "https://github.com/rriffel/saira"

[tool.setuptools.packages.find]
include = ["saira*"]

[tool.setuptools.package-data]
saira = [
    "suport_files/*",
    "examples/**/*",
    "assets/*",
]

